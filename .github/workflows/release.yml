name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-main:
    name: Verify tag belongs to main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require tagged commit on main
        run: git merge-base --is-ancestor HEAD origin/main

  ci:
    name: Run CI checks
    needs: verify-main
    uses: ./.github/workflows/ci.yml

  build:
    name: Build release artifacts
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and package binaries
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          archive_version="${GITHUB_REF_NAME#v}"

          build_archive() {
            local goos="$1"
            local goarch="$2"
            local archive="peco_${archive_version}_${goos}_${goarch}.tar.gz"
            local stage="dist/${goos}-${goarch}"
            mkdir -p "$stage"
            for binary in peco peco-server; do
              GOOS="$goos" GOARCH="$goarch" go build -trimpath \
                -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
                -o "$stage/$binary" "./cmd/$binary"
            done
            cp README.md LICENSE "$stage/"
            tar -C "$stage" -czf "dist/$archive" peco peco-server README.md LICENSE
            rm -r "$stage"
          }

          build_archive darwin arm64
          build_archive linux amd64
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
